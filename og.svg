<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#cbd5e1" opacity="0.55"/>
    </pattern>
    <filter id="soft" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Cream paper -->
  <rect width="1200" height="630" fill="#faf8f3"/>

  <!-- Subtle dot grid backdrop on right half -->
  <rect x="660" y="0" width="540" height="630" fill="url(#dots)" opacity="0.45"/>

  <!-- Decorative slate board on the right (focal anchor element) -->
  <g transform="translate(720 90) rotate(-2 210 150)">
    <!-- shadow -->
    <rect x="6" y="14" width="420" height="300" rx="20" fill="#0f172a" opacity="0.10" filter="url(#soft)"/>
    <!-- slate body -->
    <rect x="0" y="0" width="420" height="300" rx="20" fill="url(#slate)"/>
    <!-- inner frame -->
    <rect x="14" y="14" width="392" height="272" rx="12" fill="none" stroke="#475569" stroke-width="2"/>
    <!-- chalk lines (lesson notes rhythm) -->
    <line x1="40" y1="60"  x2="380" y2="60"  stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <line x1="40" y1="100" x2="320" y2="100" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <line x1="40" y1="140" x2="280" y2="140" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <line x1="40" y1="180" x2="240" y2="180" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <!-- checkmark on a "completed" line -->
    <path d="M 280 195 l 14 14 l 28 -28" fill="none" stroke="#84cc16" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="40" y1="220" x2="200" y2="220" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <!-- chalk dust glow at base -->
    <ellipse cx="200" cy="260" rx="180" ry="6" fill="#cbd5e1" opacity="0.12"/>
  </g>

  <!-- Brand mark (top-left) -->
  <g transform="translate(80 80)">
    <rect x="0" y="0" width="44" height="40" rx="6" fill="#475569"/>
    <line x1="9"  y1="11" x2="35" y2="11" stroke="#e2e8f0" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="9"  y1="20" x2="29" y2="20" stroke="#e2e8f0" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="9"  y1="29" x2="25" y2="29" stroke="#e2e8f0" stroke-width="2.4" stroke-linecap="round"/>
    <text x="62" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="28" font-weight="700" fill="#1e293b" letter-spacing="-0.5">Slatework</text>
  </g>

  <!-- Live status pill -->
  <g transform="translate(80 144)">
    <rect x="0" y="0" width="200" height="34" rx="17" fill="#1e293b"/>
    <circle cx="20" cy="17" r="4" fill="#84cc16"/>
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" letter-spacing="0.4">10 free tools · live now</text>
  </g>

  <!-- Headline (the focal typographic element) -->
  <g transform="translate(80 248)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', sans-serif" fill="#0f172a" letter-spacing="-2.5">
    <text font-size="86" font-weight="800">
      <tspan x="0" y="0">Free tools for</tspan>
      <tspan x="0" y="92">independent</tspan>
      <tspan x="0" y="184">language tutors.</tspan>
    </text>
  </g>

  <!-- Accent rule under headline -->
  <rect x="80" y="450" width="120" height="6" rx="3" fill="#475569"/>

  <!-- Tool category list -->
  <text x="80" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#475569" letter-spacing="2.2">SETUP · TAX · INSURANCE · RATES · CONTRACTS · LESSONS · MARKING · CEFR</text>

  <!-- URL (bottom-left) -->
  <g transform="translate(80 580)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#1e293b" letter-spacing="-0.2">slatework.tools</text>
    <line x1="0" y1="9" x2="180" y2="9" stroke="#1e293b" stroke-width="1.5"/>
  </g>

  <!-- Country pack badge (bottom-right) -->
  <g transform="translate(910 562)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
    <text x="0" y="0" font-size="13" font-weight="500" fill="#64748b" letter-spacing="0.5">Country-aware for</text>
    <text x="0" y="22" font-size="18" font-weight="700" fill="#1e293b" letter-spacing="-0.2">US · UK · CA · AU · NZ · IE · HK</text>
  </g>
</svg>
